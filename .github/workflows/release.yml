name: Release

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'gateway-release'
  cancel-in-progress: true

env:
  # Single source for the release number: Octopus release, production image tag and GitHub Release
  RELEASE_VERSION: 1.0.${{ github.run_number }}

jobs:
  publish-docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: metadata
        uses: docker/metadata-action@v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Set Image Tag
        id: dockerfile
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "dockerfile=./src/docker/Dockerfile.dev" >> $GITHUB_OUTPUT
          echo "target=development" >> $GITHUB_OUTPUT
          echo "image_tag=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          target: ${{ steps.dockerfile.outputs.target }}
          push: false
          load: true
          tags: ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:latest
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Start Docker Container
        run: |
          # Create Docker network for containers to communicate
          docker network create gateway-test-net || true

          # Start MySQL service first
          docker run -d --name mysql-test \
              --network gateway-test-net \
              -e MYSQL_ROOT_PASSWORD=frostfire_forge_development \
              -e MYSQL_DATABASE=frostfire_forge_development \
              mysql:9.0 \
              --max-connections=500

          # Wait for MySQL to be fully ready (accept connections)
          for i in {1..40}; do
              if docker exec mysql-test mysql -h localhost -u root -pfrostfire_forge_development -e "SELECT 1" > /dev/null 2>&1; then
              echo "MySQL is ready!"
              break
              fi
              echo "Waiting for MySQL... ($i/40)"
              sleep 1
          done

          # Start gateway container with MySQL dependency
          # Override env vars to connect to mysql-test on internal port
          docker run -d --name gateway-test \
              --network gateway-test-net \
              --env-file=.env.development \
              -e DATABASE_HOST=mysql-test \
              -e DATABASE_PORT=3306 \
              -p 9999:9999 \
              -p 80:80 \
              ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:latest

          # Wait for healthcheck to pass on both ports
          for i in {1..60}; do
              if curl -sf http://localhost:9999/status > /dev/null 2>&1 && curl -sf http://localhost:80/status > /dev/null 2>&1; then
              echo "Container is healthy on both ports!"
              exit 0
              fi
              echo "Waiting for container health... ($i/60)"
              sleep 2
          done

          echo "Container failed health check"
          docker logs gateway-test
          docker logs mysql-test
          exit 1

      - name: Stop Test Container
        if: always()
        run: |
          docker stop gateway-test mysql-test || true
          docker rm gateway-test mysql-test || true
          docker network rm gateway-test-net || true

      - name: Push Docker Image to GitHub Packages
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          target: ${{ steps.dockerfile.outputs.target }}
          push: true
          tags: |
            ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:latest
            ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  publish-production:
    name: Build and Publish Production Docker Image
    runs-on: ubuntu-latest
    needs: [publish-docker]
    if: success()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The development image already owns ghcr.io/<repository> and its latest tag,
      # so the production image is published beside it with a -prod suffix.
      - name: Set Production Image Tag
        id: dockerfile
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "dockerfile=./src/docker/Dockerfile.prod" >> $GITHUB_OUTPUT
          echo "target=production" >> $GITHUB_OUTPUT
          echo "image_tag=${REPO_LOWER}-prod" >> $GITHUB_OUTPUT

      - name: Verify Release Version Is Unused
        run: |
          IMAGE="ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:${{ env.RELEASE_VERSION }}"
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is already published. Version tags never move: start a new run instead of re-running this one."
            exit 1
          fi
          echo "$IMAGE is not published yet"

      - name: Build production Docker image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          target: ${{ steps.dockerfile.outputs.target }}
          push: false
          load: true
          tags: ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:${{ env.RELEASE_VERSION }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Verify Production Image Contains No Secrets
        run: |
          IMAGE="ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:${{ env.RELEASE_VERSION }}"
          FOUND=$(docker run --rm --entrypoint sh "$IMAGE" -c "find /app -path /app/node_modules -prune -o \( -name '.env*' -o -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -type f -path '/app/src/certs/*' ! -name '.gitkeep' \) -print")
          if [ -n "$FOUND" ]; then
            echo "Production image contains env files, keys or certificates. Not publishing."
            echo "$FOUND"
            exit 1
          fi
          echo "No env files, keys or certificates in the production image"

      - name: Push Production Docker Image to GitHub Packages
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          target: ${{ steps.dockerfile.outputs.target }}
          push: true
          tags: |
            ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:latest
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-production]
    if: success()
    permissions:
      contents: write
    steps:
      - name: Set Production Image Tag
        id: dockerfile
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${REPO_LOWER}-prod" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.RELEASE_VERSION }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${{ env.RELEASE_VERSION }}" \
            --notes "Docker image: ghcr.io/${{ steps.dockerfile.outputs.image_tag }}:${{ env.RELEASE_VERSION }}" \
            --generate-notes

  deploy:
    name: Octopus Deployment
    runs-on: ubuntu-latest
    env:
      OCTOPUS_SPACE: 'Default'
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
    permissions:
      id-token: write
    needs: [publish-docker]
    if: success()
    steps:
    - name: Create a release in Octopus Deploy 🐙
      uses: OctopusDeploy/create-release-action@v3
      with:
        project: 'Frostfire Forge Gateway'
        release_number: ${{ env.RELEASE_VERSION }}

    - name: Deploy a release in Octopus Deploy 🐙
      id: deploy_release
      uses: OctopusDeploy/deploy-release-action@v3
      with:
        project: 'Frostfire Forge Gateway'
        release_number: ${{ env.RELEASE_VERSION }}
        environments: |
            Production
    - name: Await task in Octopus Deploy 🐙
      id: await_task_in_octopus_deploy
      uses: OctopusDeploy/await-task-action@v4
      with:
        server_task_id: ${{ fromJson(steps.deploy_release.outputs.server_tasks)[0].serverTaskId }}