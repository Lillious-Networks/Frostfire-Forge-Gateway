<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <link rel="icon" type="image/ico" href="./img/icons/favicon.ico">
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">
        <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="theme-color" content="#0b1120">
        <title>Frostfire Forge - Two-Factor Authentication</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/frontend.css">
        <link rel="stylesheet" href="css/2fa-challenge.css">
        <script src="./js/web/theme.js"></script>
        <script src="./js/web/notification.js"></script>
        <script defer src="./js/web/2fa_challenge.js"></script>
        <script defer src="./js/web/pulltorefresh.js"></script>
    </head>
    <body>
        <div id="ptr-indicator" aria-hidden="true">
            <svg id="ptr-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            <span id="ptr-label">Pull to refresh</span>
        </div>
        <header class="site-bar">
            <a class="site-brand" href="/" aria-label="Frostfire Forge home">
                <img src="./img/logo.png" alt="" width="30" height="30">
                <span class="site-brand-name">Frostfire Forge</span>
            </a>
            <nav class="site-actions" aria-label="Site">
                <a class="site-link" href="/docs">Docs</a>
                <button id="theme-button" class="site-icon-button" type="button" aria-label="Switch theme" title="Switch theme">
                    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
                </button>
            </nav>
        </header>
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <p class="eyebrow">Security check</p>
                    <h1>Two-Factor Authentication</h1>
                    <p id="challenge-message">Verify your identity to continue</p>
                </div>

                <div id="method-picker" class="hidden">
                    <p class="method-picker-text">Choose a verification method</p>
                    <button type="button" id="pick-webauthn" class="btn hidden">Verify with Security Key</button>
                    <button type="button" id="pick-totp" class="btn hidden">Use Authenticator App</button>
                </div>

                <div id="code-section" class="hidden">
                    <div class="form-group">
                        <label id="code-label" for="code-input">Code</label>
                        <input type="text" id="code-input" placeholder="000000" maxlength="6" spellcheck="false" autocomplete="off">
                    </div>
                    <button type="button" id="code-submit-btn" class="btn">Verify</button>
                    <button type="button" id="code-back-btn" class="btn btn-danger">Back</button>
                </div>
            </div>
        </div>
    </body>
</html>
