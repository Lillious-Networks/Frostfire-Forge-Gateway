<!DOCTYPE html>
<html lang="en" data-theme="dark">

        <link rel="icon" type="image/ico" href="./img/icons/favicon.ico">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#0b1120">
        <meta name="description" content="Documentation for Frostfire Forge: setup, the game engine, the gateway, the asset server, editors, and the player guide.">
        <title>Frostfire Forge Docs</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./css/docs.css">
    </head>
    <body>

            <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
            <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>

            <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>

            <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></symbol>
            <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></symbol>

            <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M12 3c3.5 2 5 5.5 5 9l-2 3H9l-2-3c0-3.5 1.5-7 5-9z"/><circle cx="12" cy="10" r="1.6"/><path d="M9 15l-2.5 2 .5 3 3-2M15 15l2.5 2-.5 3-3-2"/></symbol>
            <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>

            <symbol id="i-danger" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5 5 10a5 5 0 0 1-10 0c0-1.8.6-3 1.8-4.2C9 10.5 11 8.500 12 3z"/></symbol>
        </svg>

        <div id="progress" class="progress" aria-hidden="true"></div>

        <header class="topbar">
            <button id="menu-button" class="icon-button menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
                <svg class="icon"><use href="#i-menu"/></svg>
            </button>
            <a class="brand" href="#/" aria-label="Frostfire Forge documentation home">
                <img src="./img/logo.png" alt="" width="30" height="30">
                <span class="brand-name">Frostfire Forge</span>
                <span class="brand-tag">Docs</span>
            </a>
            <button id="search-button" class="search-button" type="button" aria-label="Search the documentation">
                <svg class="icon"><use href="#i-search"/></svg>
                <span class="search-button-label">Search docs</span>
                <kbd id="search-shortcut">Ctrl K</kbd>
            </button>
            <div class="topbar-actions">
                <button id="theme-button" class="icon-button" type="button" aria-label="Switch theme" title="Switch theme">
                    <svg class="icon"><use id="theme-icon" href="#i-sun"/></svg>
                </button>
                <a id="account-link" class="button button-ghost account-link" href="/">
                    <svg class="icon"><use id="account-icon" href="#i-user"/></svg>
                    <span id="account-label" class="account-label">Log in</span>
                </a>
            </div>
        </header>

        <div class="layout">
            <aside id="sidebar" class="sidebar" aria-label="Documentation pages">
                <nav id="nav"></nav>
            </aside>
            <main id="main" class="main" tabindex="-1">
                <div id="view" class="view">
                    <div class="skeleton" aria-hidden="true">
                        <div class="skeleton-line skeleton-title"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line skeleton-short"></div>
                    </div>
                </div>
            </main>
            <aside id="toc" class="toc" aria-label="On this page"></aside>
        </div>

        <div id="scrim" class="scrim" hidden></div>

        <div id="search" class="search" role="dialog" aria-modal="true" aria-label="Search the documentation" hidden>
            <div class="search-panel">
                <div class="search-field">
                    <svg class="icon"><use href="#i-search"/></svg>
                    <input id="search-input" type="search" placeholder="Search pages, commands, settings..." autocomplete="off" spellcheck="false" aria-controls="search-results">
                    <kbd>Esc</kbd>
                </div>
                <div id="search-results" class="search-results" role="listbox"></div>
                <div class="search-footer">
                    <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> to move</span>
                    <span><kbd>Enter</kbd> to open</span>
                    <span id="search-count" class="search-count"></span>
                </div>
            </div>
        </div>

        <button id="to-top" class="to-top" type="button" aria-label="Back to top" hidden>
            <svg class="icon"><use href="#i-arrow-up"/></svg>
        </button>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <noscript><p class="noscript">The documentation needs JavaScript to load its pages.</p></noscript>
        <script src="./js/web/docs.js"></script>
    </body>
</html>
