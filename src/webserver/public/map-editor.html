<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Editor</title>
    <!-- The look every tool window shares, then what only the map editor has: its layer rows, its toolbar and its tile palette. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <link rel="stylesheet" href="./css/mapeditor.css" />
    <script defer src="./js/core/tileeditorbridge.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- The frame of a tool window; js/core/tileeditorbridge.ts fills it in. -->
    <div class="tl-app me-app">
      <!-- The map's tile layers, and its two object layers. -->
      <aside id="me-side" class="tl-side me-side" aria-label="Layers"></aside>
      <div class="tl-main">
        <!-- The map, the layer and the tool in use, and undo, redo and save. -->
        <header id="me-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <!-- The tools, each with the key that picks it. -->
        <div id="me-toolbar" class="me-toolbar" role="toolbar" aria-label="Tools"></div>
        <!-- The tile palette: the tilesets as tabs, and the one in view to pick tiles from. -->
        <main id="me-page" class="tl-page tl-page-fill me-page"></main>
      </div>
    </div>
    <!-- What came of what was asked for, shown for a few seconds. -->
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The map editor needs JavaScript.</noscript>
  </body>
</html>
