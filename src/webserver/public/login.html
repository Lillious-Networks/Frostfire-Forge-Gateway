<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <link rel="icon" type="image/ico" href="img/icons/favicon.ico">
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1120">
    <title>Frostfire Forge - Gateway Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/frontend.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/web/theme.js"></script>
    <script defer src="js/web/pulltorefresh.js"></script>
</head>
<body>
    <div id="ptr-indicator" aria-hidden="true">
        <svg id="ptr-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        <span id="ptr-label">Pull to refresh</span>
    </div>
    <header class="site-bar">
        <a class="site-brand" href="/" aria-label="Gateway login">
            <img src="img/logo.png" alt="" width="30" height="30">
            <span class="site-brand-name">Frostfire Forge</span>
            <span class="site-tag">Gateway</span>
        </a>
        <nav class="site-actions" aria-label="Site">
            <button id="theme-button" class="site-icon-button" type="button" aria-label="Switch theme" title="Switch theme">
                <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
            </button>
        </nav>
    </header>
    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <p class="eyebrow">Monitoring dashboard</p>
                <h1>Gateway Login</h1>
                <p id="status-text">Checking your sign-in...</p>
            </div>

            <div id="error-message" class="error-message"></div>

            <div id="account-row" class="account-row hidden">
                <span class="account-label">Signed in as</span>
                <strong id="account-name"></strong>
            </div>

            <button type="button" id="open-button" class="login-button hidden">Open Dashboard</button>
            <a id="login-link" class="login-button hidden" href="/">Log In</a>
            <a id="switch-link" class="guest-link hidden" href="/">Use a different account</a>
        </div>
    </div>

    <script>
        // The dashboard has no login of its own. It opens for an admin account
        // that is signed in on the website and holds server.gateway or
        // server.*; everyone else is pointed at the website login.
        const statusText = document.getElementById('status-text');
        const errorMessage = document.getElementById('error-message');
        const accountRow = document.getElementById('account-row');
        const accountName = document.getElementById('account-name');
        const openButton = document.getElementById('open-button');
        const loginLink = document.getElementById('login-link');
        const switchLink = document.getElementById('switch-link');

        // Set after "Logout" on the dashboard, so the page does not sign
        // straight back in.
        const signedOut = new URLSearchParams(location.search).has('signedout');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function show(element, visible) {
            element.classList.toggle('hidden', !visible);
        }

        function render(session) {
            const signedIn = !!session.username;
            const allowed = session.state === 'allowed';

            loginLink.href = session.loginUrl || '/';
            switchLink.href = session.loginUrl || '/';
            accountName.textContent = session.username || '';

            show(accountRow, signedIn);
            show(openButton, allowed);
            show(loginLink, !signedIn);
            show(switchLink, signedIn);

            if (session.state === 'signed-out') {
                statusText.textContent = 'Log in with an admin account to open the dashboard.';
            } else if (session.state === 'forbidden') {
                statusText.textContent = 'This account cannot open the dashboard. It must be an admin with the server.gateway or server.* permission.';
            } else if (allowed) {
                statusText.textContent = signedOut ? 'You left the dashboard. Open it again whenever you are ready.' : 'Opening the dashboard...';
            } else {
                statusText.textContent = 'Your sign-in could not be checked.';
                showError('The gateway could not reach the account database. Try again in a moment.');
            }
        }

        async function openDashboard() {
            openButton.disabled = true;
            errorMessage.classList.remove('show');
            try {
                const response = await fetch('/api/login', { method: 'POST' });
                if (response.ok) {
                    window.location.href = '/dashboard';
                    return;
                }
                const data = await response.json().catch(() => ({}));
                showError(data.error || 'The dashboard could not be opened.');
            } catch (error) {
                showError('Network error. Please try again.');
            }
            openButton.disabled = false;
            statusText.textContent = 'The dashboard did not open.';
        }

        async function init() {
            let session;
            try {
                const response = await fetch('/api/session', { cache: 'no-store' });
                session = await response.json();
            } catch (error) {
                session = { state: 'error' };
            }
            render(session);
            if (session.state === 'allowed' && !signedOut) openDashboard();
        }

        openButton.addEventListener('click', openDashboard);
        init();
    </script>
</body>
</html>
