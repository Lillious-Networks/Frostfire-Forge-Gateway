<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" type="image/ico" href="./img/icons/favicon.ico">
        <meta charset="utf-8">
        <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="theme-color" content="#000000">
        <title>Frostfire Forge - Forgot Password</title>
        <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/frontend.css">
        <link rel="stylesheet" href="css/forgot-password.css">
        <script src="./js/web/notification.js"></script>
        <script defer src="./js/web/forgotpassword.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="home-button" onclick="location.href='/'">←</div>
            <div class="form-container">
                <div class="form-header">
                    <h1>Reset Password</h1>
                    <p>Enter your email address and we'll send you a link to reset your password</p>
                </div>

                <div id="error-message" class="error-message"></div>

                <form id="forgotpassword-form">
                    <div class="form-group">
                        <label for="forgotpassword-email">Email Address</label>
                        <input type="email" id="forgotpassword-email" name="email" placeholder="john.doe@example.com" spellcheck="false" autocomplete="off" required>
                    </div>
                    <button type="button" id="forgotpassword-button" class="submit-button">Send Reset Link</button>
                </form>

                <div class="back-link">
                    <a href="/" id="login-link">Back to login</a>
                </div>
            </div>
        </div>
    </body>
</html>
