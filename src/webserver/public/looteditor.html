<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Table Editor</title>
    <!-- The look every tool window shares, then the few parts only this editor has. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <link rel="stylesheet" href="./css/looteditor.css" />
    <script defer src="./js/core/looteditorbridge.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- The workbench every editor uses; js/core/tooleditor.ts fills it in. -->
    <div class="tl-app tl-app-editor">
      <!-- The loot tables, and where a new one is started. -->
      <aside id="tl-side" class="tl-side"></aside>
      <div class="tl-main">
        <!-- The table that is open, whether its changes have reached the server, and Reload and Delete. -->
        <header id="tl-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <div id="tl-tabs" class="tl-tabs" hidden></div>
        <!-- The rows of the open table, edited in place. -->
        <main id="tl-page" class="tl-page"></main>
      </div>
    </div>
    <!-- What became of a change, shown for a few seconds. -->
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The loot table editor needs JavaScript.</noscript>
  </body>
</html>
