<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Editor</title>
    <!-- The look every tool window shares, then the few parts only this editor has. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <link rel="stylesheet" href="./css/playereditor.css" />
    <script defer src="./js/core/playereditorbridge.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- The workbench every editor uses; js/core/tooleditor.ts fills it in. -->
    <div class="tl-app tl-app-editor">
      <!-- Who is online, or the accounts found by the search. -->
      <aside id="tl-side" class="tl-side"></aside>
      <div class="tl-main">
        <!-- The player who is open, how they stand, and whether what was changed has reached the server. -->
        <header id="tl-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <!-- Overview, stats, inventory, equipment, collections, social, quests, access. -->
        <div id="tl-tabs" class="tl-tabs" hidden></div>
        <main id="tl-page" class="tl-page"></main>
      </div>
    </div>
    <!-- What the server did with a change, shown for a few seconds. -->
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The player editor needs JavaScript.</noscript>
  </body>
</html>
