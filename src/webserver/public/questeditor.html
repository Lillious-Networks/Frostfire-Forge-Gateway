<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quest Editor</title>
    <!-- The look every tool window shares, the pick-several field the quest and NPC editors share, then the quest editor's own parts. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <link rel="stylesheet" href="./css/questnpcparts.css" />
    <link rel="stylesheet" href="./css/questeditor.css" />
    <script defer src="./js/core/questeditorbridge.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- The workbench every editor uses; js/core/tooleditor.ts fills it in. -->
    <div class="tl-app tl-app-editor">
      <!-- The quests found by the search, and where a new one is started. -->
      <aside id="tl-side" class="tl-side"></aside>
      <div class="tl-main">
        <!-- What is open, how it stands, and what can be done to it. -->
        <header id="tl-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <div id="tl-tabs" class="tl-tabs" hidden></div>
        <main id="tl-page" class="tl-page"></main>
      </div>
    </div>
    <!-- What the server answered, shown for a few seconds. -->
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The quest editor needs JavaScript.</noscript>
  </body>
</html>
