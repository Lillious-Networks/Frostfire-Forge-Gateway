<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Panel</title>
    <!-- The look every tool window shares, then what only the control panel has. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <link rel="stylesheet" href="./css/controlpanel.css" />
    <script defer src="./js/core/controlpanelbridge.js" type="text/javascript"></script>
  </head>
  <body>
    <div class="tl-app">
      <!-- The categories; the script fills them in, with who is looking at the foot. -->
      <nav id="cp-nav" class="tl-side cp-nav" aria-label="Control panel pages"></nav>
      <div class="tl-main">
        <!-- Where you are, and the server's state at a glance. -->
        <header id="tl-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <main id="tl-page" class="tl-page"></main>
      </div>
    </div>
    <!-- What the server answered, shown for a few seconds. -->
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The control panel needs JavaScript.</noscript>
  </body>
</html>
