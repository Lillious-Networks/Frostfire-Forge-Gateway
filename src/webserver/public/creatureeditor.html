<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creature Editor</title>
    <!-- The look every tool window shares, then what only the creature editor has. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <link rel="stylesheet" href="./css/creatureeditor.css" />
    <script defer src="./js/core/creatureeditorbridge.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- The workbench every editor uses. js/core/tooleditor.ts fills it in:
         the same parts as the other editors, with the kinds of record over the list. -->
    <div class="tl-app tl-app-editor">
      <!-- Creatures, patrol paths, link groups and spawn pools; the list of the kind picked; the overlay drawn in the game. -->
      <aside id="tl-side" class="tl-side"></aside>
      <div class="tl-main">
        <!-- What is open, how it stands, and what can be done to it. -->
        <header id="tl-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <!-- The pages of a creature. The other kinds fit one page. -->
        <div id="tl-tabs" class="tl-tabs" hidden></div>
        <main id="tl-page" class="tl-page"></main>
      </div>
    </div>
    <!-- What the server answered, shown for a few seconds. -->
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The creature editor needs JavaScript.</noscript>
  </body>
</html>
